name: CI - Rollback Environment

run-name: Rollback to previous stable (${{ inputs.target_env }})${{ inputs.correlation_id && format(' ({0})', inputs.correlation_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Target environment in deploy repo
        required: true
        type: choice
        options:
          - staging
          - prod-blue
          - prod-green
      correlation_id:
        description: Correlation id from issue orchestrator (optional)
        required: false
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: Check rollback credentials
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}

    steps:
      - name: Validate deploy token
        id: gate
        env:
          APP_PR_TOKEN: ${{ secrets.APP_PR_TOKEN }}
        run: |
          if [ -z "$APP_PR_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "APP_PR_TOKEN not configured; skipping rollback"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  rollback-staging:
    name: Rollback staging to previous stable
    needs: gate
    if: inputs.target_env == 'staging' && needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Dispatch and wait deploy rollback workflow
        env:
          GH_TOKEN: ${{ secrets.APP_PR_TOKEN }}
          DEPLOY_REPO: pipeops-platform/devops-lab-deploy
          DEPLOY_BASE_BRANCH: main
          TARGET_ENV: ${{ inputs.target_env }}
          CORRELATION_ID: ${{ inputs.correlation_id != '' && inputs.correlation_id || format('app-rollback-{0}-{1}', github.run_id, github.job) }}
          REQUESTED_BY: ${{ github.actor }}
        run: |
          WORKFLOW_NAME="Rollback Environment"

          gh workflow run "$WORKFLOW_NAME" \
            --repo "$DEPLOY_REPO" \
            --ref "$DEPLOY_BASE_BRANCH" \
            -f target_env="$TARGET_ENV" \
            -f requested_by="$REQUESTED_BY" \
            -f correlation_id="$CORRELATION_ID"

          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "$DEPLOY_REPO" \
              --workflow "$WORKFLOW_NAME" \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | contains(\"$CORRELATION_ID\")) | .databaseId" | head -n 1)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "Could not find dispatched deploy rollback run for correlation id: $CORRELATION_ID"
            exit 1
          fi

          gh run watch --repo "$DEPLOY_REPO" "$RUN_ID" --exit-status

  rollback-production:
    name: Rollback production slot to previous stable
    needs: gate
    if: (inputs.target_env == 'prod-blue' || inputs.target_env == 'prod-green') && needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Dispatch and wait deploy rollback workflow
        env:
          GH_TOKEN: ${{ secrets.APP_PR_TOKEN }}
          DEPLOY_REPO: pipeops-platform/devops-lab-deploy
          DEPLOY_BASE_BRANCH: main
          TARGET_ENV: ${{ inputs.target_env }}
          CORRELATION_ID: ${{ inputs.correlation_id != '' && inputs.correlation_id || format('app-rollback-{0}-{1}', github.run_id, github.job) }}
          REQUESTED_BY: ${{ github.actor }}
        run: |
          WORKFLOW_NAME="Rollback Environment"

          gh workflow run "$WORKFLOW_NAME" \
            --repo "$DEPLOY_REPO" \
            --ref "$DEPLOY_BASE_BRANCH" \
            -f target_env="$TARGET_ENV" \
            -f requested_by="$REQUESTED_BY" \
            -f correlation_id="$CORRELATION_ID"

          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "$DEPLOY_REPO" \
              --workflow "$WORKFLOW_NAME" \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | contains(\"$CORRELATION_ID\")) | .databaseId" | head -n 1)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "Could not find dispatched deploy rollback run for correlation id: $CORRELATION_ID"
            exit 1
          fi

          gh run watch --repo "$DEPLOY_REPO" "$RUN_ID" --exit-status