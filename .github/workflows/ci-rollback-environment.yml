name: CI - Rollback Environment

run-name: Rollback to previous stable (${{ inputs.target_env }})${{ inputs.correlation_id && format(' ({0})', inputs.correlation_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Target environment in deploy repo
        required: true
        type: choice
        options:
          - staging
          - prod-blue
          - prod-green
          - aws-staging
      correlation_id:
        description: Correlation id from issue orchestrator (optional)
        required: false
        type: string
      rollback_version:
        description: Optional image tag to rollback to (e.g. sha-...); when empty uses previous stable
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  gate:
    name: Check rollback credentials
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}

    steps:
      - name: Validate deploy token
        id: gate
        env:
          APP_PR_TOKEN: ${{ secrets.APP_PR_TOKEN }}
        run: |
          if [ -z "$APP_PR_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "APP_PR_TOKEN not configured; skipping rollback"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  rollback-staging:
    name: Rollback staging to previous stable
    needs: gate
    if: inputs.target_env == 'staging' && needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Dispatch and wait deploy rollback workflow
        env:
          GH_TOKEN: ${{ secrets.APP_PR_TOKEN }}
          DEPLOY_REPO: pipeops-platform/devops-lab-deploy
          DEPLOY_BASE_BRANCH: main
          TARGET_ENV: ${{ inputs.target_env }}
          CORRELATION_ID: ${{ inputs.correlation_id != '' && inputs.correlation_id || format('app-rollback-{0}-{1}', github.run_id, github.job) }}
          REQUESTED_BY: ${{ github.actor }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: |
          WORKFLOW_NAME="Rollback Environment"

          gh workflow run "$WORKFLOW_NAME" \
            --repo "$DEPLOY_REPO" \
            --ref "$DEPLOY_BASE_BRANCH" \
            -f target_env="$TARGET_ENV" \
            -f requested_by="$REQUESTED_BY" \
            -f correlation_id="$CORRELATION_ID" \
            -f rollback_version="$ROLLBACK_VERSION"

          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "$DEPLOY_REPO" \
              --workflow "$WORKFLOW_NAME" \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | contains(\"$CORRELATION_ID\")) | .databaseId" | head -n 1)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "Could not find dispatched deploy rollback run for correlation id: $CORRELATION_ID"
            exit 1
          fi

          gh run watch --repo "$DEPLOY_REPO" "$RUN_ID" --exit-status

  rollback-production:
    name: Rollback production slot to previous stable
    needs: gate
    if: (inputs.target_env == 'prod-blue' || inputs.target_env == 'prod-green') && needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Dispatch and wait deploy rollback workflow
        env:
          GH_TOKEN: ${{ secrets.APP_PR_TOKEN }}
          DEPLOY_REPO: pipeops-platform/devops-lab-deploy
          DEPLOY_BASE_BRANCH: main
          TARGET_ENV: ${{ inputs.target_env }}
          CORRELATION_ID: ${{ inputs.correlation_id != '' && inputs.correlation_id || format('app-rollback-{0}-{1}', github.run_id, github.job) }}
          REQUESTED_BY: ${{ github.actor }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: |
          WORKFLOW_NAME="Rollback Environment"

          gh workflow run "$WORKFLOW_NAME" \
            --repo "$DEPLOY_REPO" \
            --ref "$DEPLOY_BASE_BRANCH" \
            -f target_env="$TARGET_ENV" \
            -f requested_by="$REQUESTED_BY" \
            -f correlation_id="$CORRELATION_ID" \
            -f rollback_version="$ROLLBACK_VERSION"

          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "$DEPLOY_REPO" \
              --workflow "$WORKFLOW_NAME" \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | contains(\"$CORRELATION_ID\")) | .databaseId" | head -n 1)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "Could not find dispatched deploy rollback run for correlation id: $CORRELATION_ID"
            exit 1
          fi

          gh run watch --repo "$DEPLOY_REPO" "$RUN_ID" --exit-status

  rollback-aws:
    name: Rollback AWS staging to previous stable
    needs: gate
    if: inputs.target_env == 'aws-staging' && needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: aws

    steps:
      - name: Dispatch and wait deploy rollback workflow
        env:
          GH_TOKEN: ${{ secrets.APP_PR_TOKEN }}
          DEPLOY_REPO: pipeops-platform/devops-lab-deploy
          DEPLOY_BASE_BRANCH: main
          TARGET_ENV: ${{ inputs.target_env }}
          CORRELATION_ID: ${{ inputs.correlation_id != '' && inputs.correlation_id || format('app-rollback-{0}-{1}', github.run_id, github.job) }}
          REQUESTED_BY: ${{ github.actor }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: |
          WORKFLOW_NAME="Rollback Environment"

          gh workflow run "$WORKFLOW_NAME" \
            --repo "$DEPLOY_REPO" \
            --ref "$DEPLOY_BASE_BRANCH" \
            -f target_env="$TARGET_ENV" \
            -f requested_by="$REQUESTED_BY" \
            -f correlation_id="$CORRELATION_ID" \
            -f rollback_version="$ROLLBACK_VERSION"

          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "$DEPLOY_REPO" \
              --workflow "$WORKFLOW_NAME" \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | contains(\"$CORRELATION_ID\")) | .databaseId" | head -n 1)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "Could not find dispatched deploy rollback run for correlation id: $CORRELATION_ID"
            exit 1
          fi

          gh run watch --repo "$DEPLOY_REPO" "$RUN_ID" --exit-status

  issue-feedback:
    name: Update source issue
    needs: [rollback-staging, rollback-production, rollback-aws]
    if: always() && startsWith(inputs.correlation_id, 'issue-')
    runs-on: ubuntu-latest

    steps:
      - name: Comment and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          TARGET_ENV: ${{ inputs.target_env }}
          STAGING_RESULT: ${{ needs.rollback-staging.result }}
          PROD_RESULT: ${{ needs.rollback-production.result }}
          AWS_RESULT: ${{ needs.rollback-aws.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ISSUE_NUMBER=$(echo "$CORRELATION_ID" | sed -E 's/^issue-([0-9]+)-.*/\1/')
          if [ -z "$ISSUE_NUMBER" ] || [ "$ISSUE_NUMBER" = "$CORRELATION_ID" ]; then
            echo "Could not extract issue number from correlation_id"
            exit 0
          fi

          DEPLOY_RESULT="skipped"
          if [ "$STAGING_RESULT" = "success" ] || [ "$PROD_RESULT" = "success" ] || [ "$AWS_RESULT" = "success" ]; then
            DEPLOY_RESULT="success"
          elif [ "$STAGING_RESULT" = "failure" ] || [ "$PROD_RESULT" = "failure" ] || [ "$AWS_RESULT" = "failure" ]; then
            DEPLOY_RESULT="failure"
          elif [ "$STAGING_RESULT" = "cancelled" ] || [ "$PROD_RESULT" = "cancelled" ] || [ "$AWS_RESULT" = "cancelled" ]; then
            DEPLOY_RESULT="cancelled"
          fi

          if [ "$DEPLOY_RESULT" = "success" ]; then
            gh label create "deploy-succeeded" --repo "$GITHUB_REPOSITORY" --color "0e8a16" --description "Deploy completed successfully" --force
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "$(printf '✅ **Rollback concluído com sucesso!**\n\n- Target: **%s**\n- Run: %s\n\nIssue fechada automaticamente.' "$TARGET_ENV" "$RUN_URL")"
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "deploy-succeeded"
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          elif [ "$DEPLOY_RESULT" = "failure" ]; then
            gh label create "deploy-failed" --repo "$GITHUB_REPOSITORY" --color "d73a4a" --description "Deploy failed" --force
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "$(printf '❌ **Rollback falhou.**\n\n- Target: **%s**\n- Run: %s\n\nVerifique os logs e crie uma nova issue se necessário.' "$TARGET_ENV" "$RUN_URL")"
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "deploy-failed"
          elif [ "$DEPLOY_RESULT" = "cancelled" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "$(printf '⚠️ **Rollback cancelado.**\n\n- Target: **%s**\n- Run: %s' "$TARGET_ENV" "$RUN_URL")"
          fi