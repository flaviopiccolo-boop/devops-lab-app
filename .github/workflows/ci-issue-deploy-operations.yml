name: CI - Issue Deploy Operations

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-request-pr:
    name: Create app PR for deploy request
    if: |
      contains(join(github.event.issue.labels.*.name, ','), 'deploy-operation') ||
      startsWith(github.event.issue.title, '[Deploy Promote]') ||
      startsWith(github.event.issue.title, '[Deploy Rollback]')
    runs-on: ubuntu-latest

    steps:
      - name: Parse issue form data
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          issue_body = os.environ.get("ISSUE_BODY", "")
          labels = {label.strip() for label in os.environ.get("ISSUE_LABELS", "").split(",") if label.strip()}
          issue_title = os.environ.get("ISSUE_TITLE", "")

          if "deploy-promotion-request" in labels:
            operation = "promote"
          elif "deploy-rollback-request" in labels:
            operation = "rollback"
          elif issue_title.startswith("[Deploy Promote]"):
            operation = "promote"
          elif issue_title.startswith("[Deploy Rollback]"):
            operation = "rollback"
          else:
            raise SystemExit("Issue does not include a supported deploy operation label")

          match = re.search(r"(?im)^###\s*Target environment\s*$\s*([\s\S]*?)(?:^###\s|\Z)", issue_body)
          if not match:
            raise SystemExit("Could not read 'Target environment' from issue body")

          target_env = next((line.strip() for line in match.group(1).splitlines() if line.strip()), "")
          allowed = {"staging", "prod-blue", "prod-green"}
          if target_env not in allowed:
            raise SystemExit(f"Unsupported target environment: {target_env!r}")

          issue_number = os.environ.get("ISSUE_NUMBER", "0")
          correlation_id = f"issue-{issue_number}-{operation}-{target_env}"

          output_file = Path(os.environ["GITHUB_OUTPUT"])
          with output_file.open("a", encoding="utf-8") as output:
            output.write(f"operation={operation}\n")
            output.write(f"target_env={target_env}\n")
            output.write(f"correlation_id={correlation_id}\n")
            output.write(f"issue_number={issue_number}\n")
            output.write(f"issue_title={issue_title}\n")
          PY

      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Create request file and pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.APP_PR_TOKEN != '' && secrets.APP_PR_TOKEN || github.token }}
          OPERATION: ${{ steps.parse.outputs.operation }}
          TARGET_ENV: ${{ steps.parse.outputs.target_env }}
          CORRELATION_ID: ${{ steps.parse.outputs.correlation_id }}
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.parse.outputs.issue_title }}
        run: |
          REQUEST_DIR=".github/deploy-requests"
          REQUEST_FILE="$REQUEST_DIR/${CORRELATION_ID}.json"
          BRANCH="deploy-request/${CORRELATION_ID}"
          BASE_BRANCH="${{ github.event.repository.default_branch }}"

          mkdir -p "$REQUEST_DIR"
          cat > "$REQUEST_FILE" <<EOF
          {
            "issue_number": ${ISSUE_NUMBER},
            "issue_title": "${ISSUE_TITLE//"/\"}",
            "operation": "${OPERATION}",
            "target_env": "${TARGET_ENV}",
            "correlation_id": "${CORRELATION_ID}",
            "requested_by": "${{ github.actor }}"
          }
          EOF

          git checkout -B "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$REQUEST_FILE"

          if git diff --cached --quiet; then
            echo "No request changes generated"
            exit 0
          fi

          git commit -m "chore(deploy): request ${OPERATION} ${TARGET_ENV} (issue #${ISSUE_NUMBER})"
          git push --force-with-lease --set-upstream origin "$BRANCH"

          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "request_file=$REQUEST_FILE" >> "$GITHUB_OUTPUT"

          gh label create "deploy-operation-request" \
            --repo "$GITHUB_REPOSITORY" \
            --color "1f6feb" \
            --description "PR created from issue-driven deploy operation" \
            --force

          EXISTING_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            PR_URL=$(gh pr view "$EXISTING_PR" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "pr_number=$EXISTING_PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_BODY=$(cat <<EOF
          Deploy operation requested from issue #${ISSUE_NUMBER}.

          - Operation: ${OPERATION}
          - Target environment: ${TARGET_ENV}
          - Requested by: ${{ github.actor }}

          <!-- deploy-operation-metadata
          issue_number: ${ISSUE_NUMBER}
          operation: ${OPERATION}
          target_env: ${TARGET_ENV}
          correlation_id: ${CORRELATION_ID}
          request_file: ${REQUEST_FILE}
          -->
          EOF
          )

          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "[Deploy ${OPERATION^}] ${TARGET_ENV} (issue #${ISSUE_NUMBER})" \
            --body "$PR_BODY" \
            --label "deploy-operation-request")

          PR_NUMBER=$(gh pr view "$PR_URL" --repo "$GITHUB_REPOSITORY" --json number --jq .number)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Comment issue with app PR link
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue_number }}
          OPERATION: ${{ steps.parse.outputs.operation }}
          TARGET_ENV: ${{ steps.parse.outputs.target_env }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          REQUEST_BRANCH: ${{ steps.pr.outputs.branch_name }}
          REQUEST_FILE: ${{ steps.pr.outputs.request_file }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "📝 Request registrada. PR criada no repositório app para aprovação.\n\n- Operation: ${OPERATION}\n- Target environment: ${TARGET_ENV}\n- Request branch: ${REQUEST_BRANCH}\n- Request file: ${REQUEST_FILE}\n- App PR: ${PR_URL}\n\nApós aprovação dessa PR no app, o deploy será disparado automaticamente."
