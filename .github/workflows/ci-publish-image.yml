name: CI - Publish Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/deploy-requests/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Publish Image
    runs-on: ubuntu-latest
    outputs:
      image_repo: ${{ steps.vars.outputs.image_repo }}
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image vars
        id: vars
        env:
          RUNTIME_IMAGE_REPO: ${{ secrets.RUNTIME_IMAGE_REPO }}
        run: |
          if [ -n "$RUNTIME_IMAGE_REPO" ]; then
            echo "image_repo=$RUNTIME_IMAGE_REPO" >> "$GITHUB_OUTPUT"
          else
            echo "image_repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          fi
          echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: startsWith(steps.vars.outputs.image_repo, 'ghcr.io/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ !startsWith(steps.vars.outputs.image_repo, 'ghcr.io/') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image_repo }}:${{ steps.vars.outputs.image_tag }}
            ${{ steps.vars.outputs.image_repo }}:latest

  open-deploy-pr:
    name: Open PR in deploy repo
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DEPLOY_REPO: pipeops-platform/devops-lab-deploy
      DEPLOY_BASE_BRANCH: main
      DEPLOY_FILE: apps/devops-lab-app/overlays/dev/kustomization.yaml
      DEPLOY_IMAGE_NAME: pipeops/devops-lab-app
      ENABLE_DEPLOY_AUTO_MERGE: ${{ secrets['ENABLE_DEPLOY_AUTO_MERGE'] }}
      NEW_IMAGE_REPO: ${{ secrets.RUNTIME_IMAGE_REPO != '' && secrets.RUNTIME_IMAGE_REPO || format('ghcr.io/{0}', github.repository) }}
      NEW_TAG: ${{ needs.publish.outputs.image_tag }}

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Check deploy token availability
        id: gate
        env:
          APP_PR_TOKEN: ${{ secrets.APP_PR_TOKEN }}
          ENABLE_DEPLOY_PROMOTION: ${{ secrets.ENABLE_DEPLOY_PROMOTION }}
        run: |
          if [ "$ENABLE_DEPLOY_PROMOTION" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ENABLE_DEPLOY_PROMOTION is not true; skipping deploy PR creation"
          elif [ -z "$APP_PR_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "APP_PR_TOKEN not configured; skipping deploy PR creation"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup GitHub CLI auth
        if: steps.gate.outputs.enabled == 'true'
        env:
          APP_PR_TOKEN: ${{ secrets.APP_PR_TOKEN }}
        run: |
          echo "$APP_PR_TOKEN" | gh auth login --with-token
          gh auth setup-git

      - name: Clone deploy repo
        if: steps.gate.outputs.enabled == 'true'
        run: |
          gh repo clone "$DEPLOY_REPO" deploy-repo

      - name: Update image tag
        if: steps.gate.outputs.enabled == 'true'
        working-directory: deploy-repo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          file_path = Path("apps/devops-lab-app/overlays/dev/kustomization.yaml")
          content = file_path.read_text(encoding="utf-8")
          deploy_image_name = "${{ env.DEPLOY_IMAGE_NAME }}".strip()
          new_image_repo = "${{ env.NEW_IMAGE_REPO }}".strip()
          if not new_image_repo:
            current_name_match = re.search(r'(?m)^\s*-\s*name:\s*(.+)$', content)
            if not current_name_match:
              raise SystemExit("Could not read current image name from deploy overlay")
            new_image_repo = current_name_match.group(1).strip()
          new_tag = "${{ env.NEW_TAG }}"

          updated = re.sub(r'(?m)^(\s*-\s*name:\s*).*$' , rf'\1{deploy_image_name}', content)
          if re.search(r'(?m)^\s*newName:\s*.+$', updated):
            updated = re.sub(r'(?m)^(\s*newName:\s*).+$', rf'\1{new_image_repo}', updated)
          else:
            updated = re.sub(
              r'(?m)^(\s*)-\s*name:\s*.+$',
              rf'\1- name: {deploy_image_name}\n\1  newName: {new_image_repo}',
              updated,
              count=1,
            )
          updated = re.sub(r'(?m)^(\s*newTag:\s*").*(")\s*$', rf'\1{new_tag}\2', updated)
          if content == updated:
            print("No tag change detected")
          file_path.write_text(updated, encoding="utf-8")
          PY

      - name: Create pull request
        if: steps.gate.outputs.enabled == 'true'
        working-directory: deploy-repo
        run: |
          if git diff --quiet -- "$DEPLOY_FILE"; then
            echo "No deploy update required"
            exit 0
          fi

          BRANCH="ci/promote-dev-${NEW_TAG}"
          git checkout -B "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DEPLOY_FILE"
          git commit -m "chore(deploy): promote dev image to ${NEW_TAG}"
          git push --force-with-lease --set-upstream origin "$BRANCH"

          EXISTING_PR=$(gh pr list --repo "$DEPLOY_REPO" --base "$DEPLOY_BASE_BRANCH" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR already exists: #$EXISTING_PR"

            if [ "$ENABLE_DEPLOY_AUTO_MERGE" = "true" ]; then
              set +e
              gh pr merge --repo "$DEPLOY_REPO" --auto --squash "$EXISTING_PR"
              MERGE_EXIT=$?
              set -e
              if [ $MERGE_EXIT -ne 0 ]; then
                echo "Auto-merge could not be enabled for existing PR #$EXISTING_PR; manual merge may still be required"
              fi
            fi
            exit 0
          fi

          gh pr create \
            --repo "$DEPLOY_REPO" \
            --base "$DEPLOY_BASE_BRANCH" \
            --head "$BRANCH" \
            --title "chore(deploy): promote dev image to ${NEW_TAG}" \
            --body "Automated dev promotion PR from app CI pipeline.\n\n- Source repo: $GITHUB_REPOSITORY\n- Source commit: $GITHUB_SHA\n- Target environment: dev\n- New image repo: ${NEW_IMAGE_REPO}\n- New image tag: ${NEW_TAG}"

          CREATED_PR=$(gh pr list --repo "$DEPLOY_REPO" --base "$DEPLOY_BASE_BRANCH" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$CREATED_PR" ]; then
            echo "Could not resolve created deploy PR number"
            exit 1
          fi

          if [ "$ENABLE_DEPLOY_AUTO_MERGE" = "true" ]; then
            set +e
            gh pr merge --repo "$DEPLOY_REPO" --auto --squash "$CREATED_PR"
            MERGE_EXIT=$?
            set -e
            if [ $MERGE_EXIT -ne 0 ]; then
              echo "Auto-merge could not be enabled for PR #$CREATED_PR; manual merge may still be required"
            fi
          fi
