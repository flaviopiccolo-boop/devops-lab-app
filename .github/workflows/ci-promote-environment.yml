name: CI - Promote Environment

run-name: Promote (${{ inputs.target_env }})${{ inputs.correlation_id && format(' ({0})', inputs.correlation_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Target environment in deploy repo
        required: true
        type: choice
        options:
          - staging
          - prod-blue
          - prod-green
      correlation_id:
        description: Correlation id from issue orchestrator (optional)
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  plan:
    name: Plan promotion path
    runs-on: ubuntu-latest
    outputs:
      source_env: ${{ steps.plan.outputs.source_env }}
      target_env: ${{ steps.plan.outputs.target_env }}

    steps:
      - name: Resolve source environment
        id: plan
        env:
          TARGET_ENV: ${{ inputs.target_env }}
        run: |
          echo "target_env=$TARGET_ENV" >> "$GITHUB_OUTPUT"

          if [ "$TARGET_ENV" = "staging" ]; then
            echo "source_env=dev" >> "$GITHUB_OUTPUT"
          elif [ "$TARGET_ENV" = "prod-blue" ] || [ "$TARGET_ENV" = "prod-green" ]; then
            echo "source_env=staging" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported target environment: $TARGET_ENV"
            exit 1
          fi

  gate:
    name: Check promotion credentials
    needs: plan
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}

    steps:
      - name: Validate deploy token
        id: gate
        env:
          APP_PR_TOKEN: ${{ secrets.APP_PR_TOKEN }}
        run: |
          if [ -z "$APP_PR_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "APP_PR_TOKEN not configured; skipping promotion"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  promote-staging:
    name: Promote dev to staging
    needs: [plan, gate]
    if: needs.plan.outputs.target_env == 'staging' && needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Dispatch and wait deploy promotion workflow
        env:
          GH_TOKEN: ${{ secrets.APP_PR_TOKEN }}
          DEPLOY_REPO: pipeops-platform/devops-lab-deploy
          DEPLOY_BASE_BRANCH: main
          SOURCE_ENV: ${{ needs.plan.outputs.source_env }}
          TARGET_ENV: ${{ needs.plan.outputs.target_env }}
          INPUT_CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          WORKFLOW_NAME="Promote Environment"
          CORRELATION_ID="$INPUT_CORRELATION_ID"
          if [ -z "$CORRELATION_ID" ]; then
            CORRELATION_ID="app-${GITHUB_RUN_ID}-${GITHUB_JOB}-${RANDOM}"
          fi

          gh workflow run "$WORKFLOW_NAME" \
            --repo "$DEPLOY_REPO" \
            --ref "$DEPLOY_BASE_BRANCH" \
            -f source_env="$SOURCE_ENV" \
            -f target_env="$TARGET_ENV" \
            -f correlation_id="$CORRELATION_ID"

          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "$DEPLOY_REPO" \
              --workflow "$WORKFLOW_NAME" \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | contains(\"$CORRELATION_ID\")) | .databaseId" | head -n 1)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "Could not find dispatched deploy workflow run for correlation id: $CORRELATION_ID"
            exit 1
          fi

          echo "Watching deploy workflow run id: $RUN_ID"
          gh run watch --repo "$DEPLOY_REPO" "$RUN_ID" --exit-status

  promote-production:
    name: Promote staging to production slot
    needs: [plan, gate]
    if: (needs.plan.outputs.target_env == 'prod-blue' || needs.plan.outputs.target_env == 'prod-green') && needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Dispatch and wait deploy promotion workflow
        env:
          GH_TOKEN: ${{ secrets.APP_PR_TOKEN }}
          DEPLOY_REPO: pipeops-platform/devops-lab-deploy
          DEPLOY_BASE_BRANCH: main
          SOURCE_ENV: ${{ needs.plan.outputs.source_env }}
          TARGET_ENV: ${{ needs.plan.outputs.target_env }}
          INPUT_CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          WORKFLOW_NAME="Promote Environment"
          CORRELATION_ID="$INPUT_CORRELATION_ID"
          if [ -z "$CORRELATION_ID" ]; then
            CORRELATION_ID="app-${GITHUB_RUN_ID}-${GITHUB_JOB}-${RANDOM}"
          fi

          gh workflow run "$WORKFLOW_NAME" \
            --repo "$DEPLOY_REPO" \
            --ref "$DEPLOY_BASE_BRANCH" \
            -f source_env="$SOURCE_ENV" \
            -f target_env="$TARGET_ENV" \
            -f correlation_id="$CORRELATION_ID"

          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "$DEPLOY_REPO" \
              --workflow "$WORKFLOW_NAME" \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | contains(\"$CORRELATION_ID\")) | .databaseId" | head -n 1)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "Could not find dispatched deploy workflow run for correlation id: $CORRELATION_ID"
            exit 1
          fi

          echo "Watching deploy workflow run id: $RUN_ID"
          gh run watch --repo "$DEPLOY_REPO" "$RUN_ID" --exit-status

  issue-feedback:
    name: Update source issue
    needs: [promote-staging, promote-production]
    if: always() && startsWith(inputs.correlation_id, 'issue-')
    runs-on: ubuntu-latest

    steps:
      - name: Comment and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          TARGET_ENV: ${{ inputs.target_env }}
          STAGING_RESULT: ${{ needs.promote-staging.result }}
          PROD_RESULT: ${{ needs.promote-production.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ISSUE_NUMBER=$(echo "$CORRELATION_ID" | sed -E 's/^issue-([0-9]+)-.*/\1/')
          if [ -z "$ISSUE_NUMBER" ] || [ "$ISSUE_NUMBER" = "$CORRELATION_ID" ]; then
            echo "Could not extract issue number from correlation_id"
            exit 0
          fi

          DEPLOY_RESULT="skipped"
          if [ "$STAGING_RESULT" = "success" ] || [ "$PROD_RESULT" = "success" ]; then
            DEPLOY_RESULT="success"
          elif [ "$STAGING_RESULT" = "failure" ] || [ "$PROD_RESULT" = "failure" ]; then
            DEPLOY_RESULT="failure"
          elif [ "$STAGING_RESULT" = "cancelled" ] || [ "$PROD_RESULT" = "cancelled" ]; then
            DEPLOY_RESULT="cancelled"
          fi

          if [ "$DEPLOY_RESULT" = "success" ]; then
            gh label create "deploy-succeeded" --repo "$GITHUB_REPOSITORY" --color "0e8a16" --description "Deploy completed successfully" --force
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "$(printf '✅ **Deploy de promotion concluído com sucesso!**\n\n- Target: **%s**\n- Run: %s\n\nIssue fechada automaticamente.' "$TARGET_ENV" "$RUN_URL")"
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "deploy-succeeded"
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          elif [ "$DEPLOY_RESULT" = "failure" ]; then
            gh label create "deploy-failed" --repo "$GITHUB_REPOSITORY" --color "d73a4a" --description "Deploy failed" --force
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "$(printf '❌ **Deploy de promotion falhou.**\n\n- Target: **%s**\n- Run: %s\n\nVerifique os logs e crie uma nova issue se necessário.' "$TARGET_ENV" "$RUN_URL")"
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "deploy-failed"
          elif [ "$DEPLOY_RESULT" = "cancelled" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "$(printf '⚠️ **Deploy de promotion cancelado.**\n\n- Target: **%s**\n- Run: %s' "$TARGET_ENV" "$RUN_URL")"
          fi
