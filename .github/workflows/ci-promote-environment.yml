name: CI - Promote Environment

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Target environment in deploy repo
        required: true
        type: choice
        options:
          - staging
          - prod-blue
          - prod-green

permissions:
  contents: read

jobs:
  plan:
    name: Plan promotion path
    runs-on: ubuntu-latest
    outputs:
      source_env: ${{ steps.plan.outputs.source_env }}
      target_env: ${{ steps.plan.outputs.target_env }}

    steps:
      - name: Resolve source environment
        id: plan
        env:
          TARGET_ENV: ${{ inputs.target_env }}
        run: |
          echo "target_env=$TARGET_ENV" >> "$GITHUB_OUTPUT"

          if [ "$TARGET_ENV" = "staging" ]; then
            echo "source_env=dev" >> "$GITHUB_OUTPUT"
          elif [ "$TARGET_ENV" = "prod-blue" ] || [ "$TARGET_ENV" = "prod-green" ]; then
            echo "source_env=staging" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported target environment: $TARGET_ENV"
            exit 1
          fi

  gate:
    name: Check promotion credentials
    needs: plan
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}

    steps:
      - name: Validate deploy token
        id: gate
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          if [ -z "$DEPLOY_REPO_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_REPO_TOKEN not configured; skipping promotion"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  promote-staging:
    name: Promote dev to staging
    needs: [plan, gate]
    if: needs.plan.outputs.target_env == 'staging' && needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Dispatch and wait deploy promotion workflow
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          DEPLOY_REPO: pipeops-platform/devops-lab-deploy
          DEPLOY_BASE_BRANCH: main
          SOURCE_ENV: ${{ needs.plan.outputs.source_env }}
          TARGET_ENV: ${{ needs.plan.outputs.target_env }}
        run: |
          WORKFLOW_NAME="Promote Environment"
          CORRELATION_ID="app-${GITHUB_RUN_ID}-${GITHUB_JOB}-${RANDOM}"

          gh workflow run "$WORKFLOW_NAME" \
            --repo "$DEPLOY_REPO" \
            --ref "$DEPLOY_BASE_BRANCH" \
            -f source_env="$SOURCE_ENV" \
            -f target_env="$TARGET_ENV" \
            -f correlation_id="$CORRELATION_ID"

          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "$DEPLOY_REPO" \
              --workflow "$WORKFLOW_NAME" \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | contains(\"$CORRELATION_ID\")) | .databaseId" | head -n 1)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "Could not find dispatched deploy workflow run for correlation id: $CORRELATION_ID"
            exit 1
          fi

          echo "Watching deploy workflow run id: $RUN_ID"
          gh run watch --repo "$DEPLOY_REPO" "$RUN_ID" --exit-status

  promote-production:
    name: Promote staging to production slot
    needs: [plan, gate]
    if: (needs.plan.outputs.target_env == 'prod-blue' || needs.plan.outputs.target_env == 'prod-green') && needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Dispatch and wait deploy promotion workflow
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          DEPLOY_REPO: pipeops-platform/devops-lab-deploy
          DEPLOY_BASE_BRANCH: main
          SOURCE_ENV: ${{ needs.plan.outputs.source_env }}
          TARGET_ENV: ${{ needs.plan.outputs.target_env }}
        run: |
          WORKFLOW_NAME="Promote Environment"
          CORRELATION_ID="app-${GITHUB_RUN_ID}-${GITHUB_JOB}-${RANDOM}"

          gh workflow run "$WORKFLOW_NAME" \
            --repo "$DEPLOY_REPO" \
            --ref "$DEPLOY_BASE_BRANCH" \
            -f source_env="$SOURCE_ENV" \
            -f target_env="$TARGET_ENV" \
            -f correlation_id="$CORRELATION_ID"

          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "$DEPLOY_REPO" \
              --workflow "$WORKFLOW_NAME" \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | contains(\"$CORRELATION_ID\")) | .databaseId" | head -n 1)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "Could not find dispatched deploy workflow run for correlation id: $CORRELATION_ID"
            exit 1
          fi

          echo "Watching deploy workflow run id: $RUN_ID"
          gh run watch --repo "$DEPLOY_REPO" "$RUN_ID" --exit-status
