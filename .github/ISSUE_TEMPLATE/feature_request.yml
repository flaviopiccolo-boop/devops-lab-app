name: Feature request
description: Propose an enhancement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Propose an improvement with clear value and acceptance criteria.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve?
      placeholder: The current behavior does not allow...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the expected behavior and implementation direction.
      placeholder: We should add...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      placeholder: Describe alternatives you evaluated.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: List objective criteria for completion.
      placeholder: |
        - [ ] Criteria 1
        - [ ] Criteria 2
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Scope, risks, or affected components.
