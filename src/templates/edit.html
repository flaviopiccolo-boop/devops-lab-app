<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit item</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/static/styles.css" rel="stylesheet" />
  </head>
  <body>
    <main class="container py-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 mb-3">Edit item #{{ item.id }}</h1>

          <form method="post" action="/items/{{ item.id }}/edit" class="row g-3">
            <div class="col-12">
              <label for="title" class="form-label">Title</label>
              <input id="title" name="title" class="form-control" value="{{ item.title }}" required />
            </div>
            <div class="col-12">
              <label for="description" class="form-label">Description</label>
              <input id="description" name="description" class="form-control" value="{{ item.description }}" />
            </div>
            <div class="col-12 d-flex gap-2">
              <button class="btn btn-primary" type="submit">Save</button>
              <a class="btn btn-outline-secondary" href="/">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
