<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>devops-lab-app - CRUD</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/static/styles.css" rel="stylesheet" />
  </head>
  <body>
    <main class="container py-5">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 m-0">Items CRUD</h1>
        <span class="badge text-bg-dark">FastAPI · DevOps Lab · CRUD UI v4</span>
      </div>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h5 mb-3">Create item</h2>
          <form method="post" action="/items" class="row g-3">
            <div class="col-md-4">
              <label for="title" class="form-label">Title</label>
              <input id="title" name="title" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label for="description" class="form-label">Description</label>
              <input id="description" name="description" class="form-control" />
            </div>
            <div class="col-md-2 d-grid align-self-end">
              <button class="btn btn-primary" type="submit">Create</button>
            </div>
          </form>
        </div>
      </section>

      <section class="card shadow-sm">
        <div class="card-body">
          <h2 class="h5 mb-3">Items list</h2>

          {% if items %}
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Title</th>
                  <th>Description</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody>
                {% for item in items %}
                <tr>
                  <td>{{ item.id }}</td>
                  <td>{{ item.title }}</td>
                  <td>{{ item.description }}</td>
                  <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary" href="/items/{{ item.id }}/edit">Edit</a>
                    <form method="post" action="/items/{{ item.id }}/delete" class="d-inline">
                      <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                    </form>
                  </td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
          {% else %}
          <p class="text-body-secondary m-0">No items yet. Create the first one above.</p>
          {% endif %}
        </div>
      </section>
    </main>
  </body>
</html>
